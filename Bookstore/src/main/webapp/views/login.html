<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="../css/login.css">

</head>
<body>
<div id="content-login" class="container-login">
    <div class="row">
        <div class="form-panel">
            <div class="form-header">
                <div class="form-header-inner">
                    <a href="#" class="form-link" id="sign-up-form-link">Sign Up</a>
                    <a href="#" class="form-link active" id="login-form-link">Login</a>
                </div>
            </div>
            <div class="form-body">
                <h3 class="form-title">Login</h3>

                <form id="login-form" action="" method="post">
                    <div class="form-group">
                        <label for="username">Username or email <span class="required">*</span></label>
                        <input type="text" name="username" id="username" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="password">Password <span class="required">*</span></label>
                        <input type="password" name="password" id="password" class="form-control">
                    </div>


                    <div class="form-group form-check">
                        <input type="checkbox" name="remember" id="remember">
                        <label for="remember">Remember me</label>
                    </div>

                    <div class="btn">
                        <button type="submit" class="form-submit">Log In</button>
                    </div>


                    <div class="form-footer">
                        <a href="#" id="forgot-password-link" class="forgot-password">Forget your password?</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>
</body>
</html>
