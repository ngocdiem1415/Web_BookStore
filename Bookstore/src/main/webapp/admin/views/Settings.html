<!--main content-->
<section class="section">
    <div class="container-fluid mb-5">
        <div class="title-wrapper pt-3">
            <div class="d-flex align-items-center">
                <!-- end col -->
                <div class="breadcrumb-wrapper">
                    <ol class="breadcrumb mx-4">
                        <li class="breadcrumb-item">
                            <a href="#" class="text-dec" style="color: gray">Dashboard</a>
                            <a href="#" class="text-dec" style="color: gray"> / </a>
                            <a href="#" class="text-dec" style="color: #f07c29">Cài đặt chung</a>
                        </li>
                    </ol>
                </div>
                <!-- end col -->
            </div>
            <!-- end row -->
        </div>
        <div class="container-fluid br-gray rounded">
            <div class="card-header my-4">
                <h3 class="card-title d-flex align-items-center gap-1 mx-2">
                    Cài đặt thông tin
                </h3>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-lg-6">
                        <form>
                            <div class="mb-4">
                                <label for="store-name" class="form-label mx-2">Tên cửa hàng: </label>
                                <input type="text" id="store-name" class="form-control" placeholder="Nhập tên cửa hàng">
                            </div>
                        </form>
                    </div>
                    <div class="col-lg-6">
                        <form>
                            <div class="mb-3">
                                <label for="owner-name" class="form-label mx-2"> Tên đầy đủ của cửa hàng:</label>
                                <input type="text" id="owner-name" class="form-control" placeholder="Nhập tên đầy đủ( nếu có)">
                            </div>
                        </form>
                    </div>
                    <div class="col-lg-6">
                        <div class="mb-3">
                            <label for="schedule-number" class="form-label mx-2" >Số liên hệ:</label>
                            <input type="number" id="schedule-number" name="schedule-number" class="form-control"
                                   placeholder="Nhập số điện thoại">
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <form>
                            <div class="mb-4">
                                <label for="schedule-email" class="form-label mx-2">Email</label>
                                <input type="email" id="schedule-email" name="schedule-email" class="form-control"
                                       placeholder="Nhập email">
                            </div>
                        </form>
                    </div>
                    <div class="col-lg-12">
                        <div class="mb-4">
                            <label for="address" class="form-label mx-2">Địa chỉ đầy đủ</label>
                            <textarea class="form-control bg-light-subtle" id="address" rows="3"
                                      placeholder="Nhập địa chỉ"></textarea>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="mb-3">
                            <label for="formFile" class="form-label mx-2">Logo</label>
                            <input class="form-control" type="file" id="formFile">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="button d-flex justify-content-center">
            <div id="cancel" class="m-4">
                <button type="button" class="btn btn-danger">Cancel</button>
            </div>
            <div id="saveChanges" class="mt-4 ">
                <button type="button" class="btn btn-success">Save change</button>
            </div>
        </div>
    </div>
</section>
