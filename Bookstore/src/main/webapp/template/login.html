<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login/Register</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../fonts/fontawesome-free-6.6.0-web/css/all.css">
    <link rel="stylesheet" href="../css/boostrap/bootstrap.min.css">


</head>
<body>

<div id="content-login" class="container-login">
    <div class="row">
        <div class="form-panel">
            <div class="form-header">
                <div class="form-header-back">
                    <a href="../views/Home.html" class="form-header-back-button"><i class="fas fa-arrow-left"></i></a>
                </div>
                <div class="form-header-inner">
                    <a href="../views/signUp.html" class="form-link" id="sign-up-form-link">Đăng ký</a>
                    <a href="../views/login.html" class="form-link active" id="login-form-link">Đăng nhập</a>
                </div>
                <div class="form-header-inner-empty"></div>
            </div>
            <div class="form-body">
                <form id="login-form" style="display: block" action="" method="post">
                    <div class="form-group">
                        <label for="username">Tên đăng nhập<span>*</span></label>
                        <input type="text" id="username" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Mật khẩu<span>*</span></label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <button class="form-submit-sign-in">Đăng nhập</button>
                </form>
                <form id="register-form">
                    <h3 class="form-title">Đăng ký</h3>
                    <!-- Form đăng ký -->
                </form>
            </div>

        </div>
    </div>
    <div class="footer-login">
        <div class="footer-login-panel">
            <div class="footer-copyright">
                <p>&copy; 2024 BookStore | Designed by <span>Team TDD</span></p>
            </div>
        </div>
    </div>
</div>


<!--all script files-->

</body>
</html>
